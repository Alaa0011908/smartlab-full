<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>غير متصل بالإنترنت - SmartLab</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, 'Cairo', system-ui, sans-serif;
      background: linear-gradient(135deg, #17919e 0%, #0d3d4e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      text-align: center;
      color: white;
      max-width: 400px;
    }
    .icon {
      font-size: 80px;
      margin-bottom: 20px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    h1 {
      font-size: 28px;
      margin-bottom: 16px;
      font-weight: 800;
    }
    p {
      font-size: 16px;
      line-height: 1.8;
      margin-bottom: 24px;
      opacity: 0.9;
    }
    .btn {
      display: inline-block;
      background: white;
      color: #17919e;
      padding: 14px 32px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }
    .tips {
      margin-top: 32px;
      padding: 20px;
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      text-align: right;
    }
    .tips h3 {
      font-size: 14px;
      margin-bottom: 12px;
      opacity: 0.8;
    }
    .tips ul {
      list-style: none;
      font-size: 13px;
      line-height: 2;
    }
    .tips li::before {
      content: "• ";
      color: #ffd700;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>غير متصل بالإنترنت</h1>
    <p>يبدو أنك غير متصل بالإنترنت. لا تقلق، يمكنك الاستمرار في التعلم عندما تعود الاتصال.</p>
    <a href="/" class="btn">إعادة المحاولة</a>
    <div class="tips">
      <h3>نصائح للعمل بدون إنترنت:</h3>
      <ul>
        <li>تم حفظ تقدمك تلقائياً</li>
        <li>راجع الدروس التي أكملتها مسبقاً</li>
        <li>استعد للتقييم القادم</li>
      </ul>
    </div>
  </div>
  <script>
    // Auto-retry when online
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
